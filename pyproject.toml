[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-kaizen"
version = "0.1.0"
description = "CLI toolkit for AI-Kaizen operational transformation at scale"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
ai-kaizen = "ai_kaizen.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_kaizen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
