{% extends "base.html" %}
{% block title %}Export: {{ ini.name }} — AI-Kaizen{% endblock %}
{% block content %}
<h1>Export: {{ ini.name }}</h1>
<p>
  <a href="{{ url_for('main.initiative_export', initiative_id=ini.id, format='json') }}" class="btn btn-small">Download JSON</a>
  <a href="{{ url_for('main.initiative_detail', initiative_id=ini.id) }}" class="btn btn-small">← Back</a>
</p>
<pre class="export-block">{{ data | tojson(indent=2) }}</pre>
{% endblock %}
